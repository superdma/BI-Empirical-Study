   <g id="text_1">
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'WenQuanYi Micro Hei', sans-serif; text-anchor: start; fill: #1f2933" x="6.542362" y="8.776421" transform="rotate(-0 6.542362 8.776421)">一个自洽的解释：形状先决定 kernel，再决定末位数值</text>
   </g>
   <g id="text_2">
    <text style="font-size: 6.6px; font-family: 'WenQuanYi Micro Hei', sans-serif; fill: #1f2933" transform="translate(32.885669 36.027943)">请求形状</text>
    <text style="font-size: 6.6px; font-family: 'WenQuanYi Micro Hei', sans-serif; fill: #1f2933" transform="translate(18.364638 44.960018)">batch / 每序列长度</text>
   </g>
   <g id="text_3">
    <text style="font-size: 6.6px; font-family: 'WenQuanYi Micro Hei', sans-serif; fill: #1f2933" transform="translate(133.265822 31.536124)">kernel 与 tile 选择</text>
    <text style="font-size: 6.6px; font-family: 'WenQuanYi Micro Hei', sans-serif; fill: #1f2933" transform="translate(124.808541 39.836558)">matmul · attention split</text>
    <text style="font-size: 6.6px; font-family: 'WenQuanYi Micro Hei', sans-serif; fill: #1f2933" transform="translate(131.845791 49.464727)">MoE tile · 跨卡归约</text>
   </g>
   <g id="text_4">
    <text style="font-size: 6.6px; font-family: 'WenQuanYi Micro Hei', sans-serif; fill: #1f2933" transform="translate(257.167559 36.027943)">浮点归约顺序</text>
    <text style="font-size: 6.6px; font-family: 'WenQuanYi Micro Hei', sans-serif; fill: #1f2933" transform="translate(244.965293 44.515033)">在 tile / split 之间变化</text>
   </g>
   <g id="text_5">
    <text style="font-size: 6.6px; font-family: 'WenQuanYi Micro Hei', sans-serif; fill: #1f2933" transform="translate(369.97299 35.531396)">logits 末位</text>
    <text style="font-size: 6.6px; font-family: 'WenQuanYi Micro Hei', sans-serif; fill: #1f2933" transform="translate(363.294615 45.01158)">差 1e-7 到 1e-1</text>
   </g>
   <g id="text_6">
    <text style="font-size: 6.6px; font-family: 'WenQuanYi Micro Hei', sans-serif; fill: #1f2933" transform="translate(459.917429 35.544286)">贪心 argmax</text>
    <text style="font-size: 6.6px; font-family: 'WenQuanYi Micro Hei', sans-serif; fill: #1f2933" transform="translate(456.083757 44.960018)">平局时翻 token</text>
   </g>
   <g id="text_7">
    <text style="font-size: 6.3px; font-family: 'WenQuanYi Micro Hei', sans-serif; fill: #1f2933" transform="translate(173.784894 86.114805)">BI 已经固定</text>
    <text style="font-size: 6.3px; font-family: 'WenQuanYi Micro Hei', sans-serif; fill: #1f2933" transform="translate(129.680956 94.179205)">matmul 归约顺序 · attention split · MoE tile</text>
   </g>
   <g id="text_8">
    <text style="font-size: 6.3px; font-family: 'WenQuanYi Micro Hei', sans-serif; fill: #1f2933" transform="translate(339.611665 86.090196)">BI 没有覆盖</text>
    <text style="font-size: 6.3px; font-family: 'WenQuanYi Micro Hei', sans-serif; fill: #1f2933" transform="translate(306.032665 94.640877)">TP all-reduce 的算法选择 · 编译产物</text>
   </g>
   <g id="text_9">
    <text style="font-size: 6.8px; font-family: 'WenQuanYi Micro Hei', sans-serif; text-anchor: start; fill: #6b7280" x="6.542362" y="117.905684" transform="rotate(-0 6.542362 117.905684)">支撑这一解释的观测（强度 A：都是重复过的现象）</text>
   </g>
   <g id="text_10">
    <text style="font-size: 6px; font-family: 'WenQuanYi Micro Hei', sans-serif; fill: #1f2933" transform="translate(44.482965 135.248287)">256 附近有边界</text>
    <text style="font-size: 6px; font-family: 'WenQuanYi Micro Hei', sans-serif; fill: #1f2933" transform="translate(25.789215 143.04773)">255 → 0.0，256 → 8.805e-02</text>
   </g>
   <g id="text_11">
    <text style="font-size: 6px; font-family: 'WenQuanYi Micro Hei', sans-serif; fill: #1f2933" transform="translate(139.127905 134.808599)">换 attention 后端、关 chunked prefill</text>
    <text style="font-size: 6px; font-family: 'WenQuanYi Micro Hei', sans-serif; fill: #1f2933" transform="translate(161.838374 142.940386)">不改变 eager 的失败</text>
   </g>
   <g id="text_12">
    <text style="font-size: 6px; font-family: 'WenQuanYi Micro Hei', sans-serif; fill: #1f2933" transform="translate(282.772219 135.166255)">TP=4 失败、PP=4 通过</text>
    <text style="font-size: 6px; font-family: 'WenQuanYi Micro Hei', sans-serif; fill: #1f2933" transform="translate(284.205188 143.192574)">（30B 与 0.6B 都是）</text>
   </g>
   <g id="text_13">
    <text style="font-size: 6px; font-family: 'WenQuanYi Micro Hei', sans-serif; fill: #1f2933" transform="translate(404.257334 134.820318)">compiled 在全部形状上通过</text>
    <text style="font-size: 6px; font-family: 'WenQuanYi Micro Hei', sans-serif; fill: #1f2933" transform="translate(417.51874 143.391792)">换编译产物又会变</text>
   </g>
   <g id="text_14">
    <text style="font-size: 6.4px; font-family: 'WenQuanYi Micro Hei', sans-serif; text-anchor: start; fill: #6b7280" x="6.542362" y="162.841263" transform="rotate(-0 6.542362 162.841263)">强度：现象为 A；第 9 章逐项测过 tile 与 split 都没有变，差异位置在某一层 norm 的输出（A），触发点尚未定位（C）。</text>
   </g>
   <g id="text_15">
    <text style="font-size: 6.4px; font-family: 'WenQuanYi Micro Hei', sans-serif; text-anchor: start; fill: #6b7280" x="6.542362" y="172.470316" transform="rotate(-0 6.542362 172.470316)">这一链条同时覆盖跨 attention 后端、跨 MoE/稠密模型、跨并行方式的失败。</text>
   </g>
  </g>
